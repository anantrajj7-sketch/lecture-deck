services:
  - type: web
    name: lecture-deck
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CONTROL_TOKEN
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.4"
